<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — LearnLoop</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><span class="logo-icon">⟳</span>LearnLoop</a>
      <div class="nav-links" id="navLinks">
        <a href="courses.html" class="nav-link">Courses</a>
        <div id="authButtons">
          <a href="login.html" class="btn-ghost">Login</a>
          <a href="register.html" class="btn-primary">Get Started</a>
        </div>
        <div id="userMenu" style="display:none">
          <span id="userGreeting" class="nav-link"></span>
          <button onclick="logout()" class="btn-ghost">Logout</button>
        </div>
      </div>
      <button class="nav-toggle" onclick="toggleNav()">☰</button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">⟳ LearnLoop</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to continue learning.</p>

      <div id="alertBox" class="alert alert-error"></div>

      <!-- Login Form — sends POST /api/auth/login -->
      <div id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com"/>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="Your password"/>
        </div>

        <button class="btn-primary btn-full" id="submitBtn" onclick="handleLogin()">
          Sign In
        </button>
      </div>

      <!-- Quick test credentials -->
      <div style="margin-top: 20px; padding: 16px; background: var(--surface2); border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--text-muted);">
        <strong style="color: var(--text);">Test Accounts (after seeding):</strong><br/>
        Student: carol@learnloop.com / password123<br/>
        Instructor: alice@learnloop.com / password123<br/>
        Admin: admin@learnloop.com / admin123
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up free</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAuth();
      if (getToken()) window.location.href = "dashboard.html";
    });

    async function handleLogin() {
      clearFieldErrors();
      hideAlert("alertBox");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      let hasError = false;

      const emailRegex = /^\w+([.-]?\w+)*@\w+([.-]?\w+)*(\.\w{2,3})+$/;
      if (!emailRegex.test(email)) {
        setFieldError(document.getElementById("email"), "Enter a valid email");
        hasError = true;
      }

      if (!password) {
        setFieldError(document.getElementById("password"), "Password is required");
        hasError = true;
      }

      if (hasError) return;

      const btn = document.getElementById("submitBtn");
      btn.textContent = "Signing in...";
      btn.disabled = true;

      try {
        const data = await apiCall("/auth/login", "POST", { email, password });
        saveAuth(data.token, data.user);
        showAlert("alertBox", "Logged in! Redirecting...", "success");

        // Redirect to where they came from, or dashboard
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect") || "dashboard.html";
        setTimeout(() => { window.location.href = redirect; }, 800);
      } catch (err) {
        showAlert("alertBox", err.message, "error");
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
