<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Courses — LearnLoop</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><span class="logo-icon">⟳</span>LearnLoop</a>
      <div class="nav-links" id="navLinks">
        <a href="courses.html" class="nav-link">Courses</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <div id="authButtons">
          <a href="login.html" class="btn-ghost">Login</a>
          <a href="register.html" class="btn-primary">Get Started</a>
        </div>
        <div id="userMenu" style="display:none">
          <span id="userGreeting" class="nav-link"></span>
          <button onclick="logout()" class="btn-ghost">Logout</button>
        </div>
      </div>
      <button class="nav-toggle" onclick="toggleNav()">☰</button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">All Courses</h1>
        <p class="page-subtitle" id="resultCount">Loading courses...</p>
      </div>

      <!-- Filters — query params sent to GET /api/courses -->
      <div class="filters">
        <input class="search-input" type="text" id="searchInput" placeholder="🔍  Search courses..." oninput="debouncedLoad()" />

        <select class="filter-select" id="categoryFilter" onchange="loadCourses()">
          <option value="">All Categories</option>
          <option value="Web Development">Web Development</option>
          <option value="Data Science">Data Science</option>
          <option value="Mobile Development">Mobile Development</option>
          <option value="DevOps">DevOps</option>
          <option value="Design">Design</option>
          <option value="Business">Business</option>
          <option value="Marketing">Marketing</option>
        </select>

        <select class="filter-select" id="levelFilter" onchange="loadCourses()">
          <option value="">All Levels</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>

        <select class="filter-select" id="sortFilter" onchange="loadCourses()">
          <option value="newest">Newest</option>
          <option value="rating">Top Rated</option>
          <option value="price-low">Price: Low → High</option>
          <option value="price-high">Price: High → Low</option>
        </select>
      </div>

      <div class="courses-grid" id="coursesGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Pagination -->
      <div id="pagination" style="display:flex; justify-content:center; gap:8px; margin-top:40px;"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let currentPage = 1;

    document.addEventListener("DOMContentLoaded", () => {
      initAuth();

      // Pre-fill category from URL params (from landing page category links)
      const params = new URLSearchParams(window.location.search);
      const cat = params.get("category");
      if (cat) document.getElementById("categoryFilter").value = cat;

      loadCourses();
    });

    async function loadCourses(page = 1) {
      currentPage = page;
      const search = document.getElementById("searchInput").value.trim();
      const category = document.getElementById("categoryFilter").value;
      const level = document.getElementById("levelFilter").value;
      const sort = document.getElementById("sortFilter").value;

      // Build query string — GET /api/courses
      const qs = new URLSearchParams({
        ...(search && { search }),
        ...(category && { category }),
        ...(level && { level }),
        sort,
        page,
        limit: 9,
      }).toString();

      try {
        const data = await apiCall(`/courses?${qs}`);
        const grid = document.getElementById("coursesGrid");
        const count = document.getElementById("resultCount");

        grid.innerHTML = "";

        if (!data.courses.length) {
          grid.innerHTML = `
            <div style="grid-column:1/-1" class="empty-state">
              <h3>No courses found</h3>
              <p>Try different filters or search terms.</p>
            </div>`;
          count.textContent = "0 courses found";
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        data.courses.forEach((c) => {
          grid.innerHTML += renderCourseCard(c);
        });

        count.textContent = `${data.pagination.total} course${data.pagination.total !== 1 ? "s" : ""} found`;
        renderPagination(data.pagination);
      } catch (err) {
        document.getElementById("coursesGrid").innerHTML =
          `<p class="error-text" style="grid-column:1/-1">Error: ${err.message}. Make sure the backend server is running on port 5000.</p>`;
      }
    }

    function renderPagination({ page, pages }) {
      const cont = document.getElementById("pagination");
      if (pages <= 1) { cont.innerHTML = ""; return; }

      let html = "";
      for (let i = 1; i <= pages; i++) {
        html += `<button
          onclick="loadCourses(${i})"
          style="padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
            background:${i === page ? "var(--accent)" : "var(--surface)"}; color:var(--text); cursor:pointer;">
          ${i}
        </button>`;
      }
      cont.innerHTML = html;
    }

    // Debounce search to avoid hammering the API
    let debounceTimer;
    function debouncedLoad() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => loadCourses(1), 400);
    }
  </script>
</body>
</html>
