<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — LearnLoop</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><span class="logo-icon">⟳</span>LearnLoop</a>
      <div class="nav-links" id="navLinks">
        <a href="courses.html" class="nav-link">Courses</a>
        <div id="authButtons">
          <a href="login.html" class="btn-ghost">Login</a>
          <a href="register.html" class="btn-primary">Get Started</a>
        </div>
        <div id="userMenu" style="display:none">
          <span id="userGreeting" class="nav-link"></span>
          <button onclick="logout()" class="btn-ghost">Logout</button>
        </div>
      </div>
      <button class="nav-toggle" onclick="toggleNav()">☰</button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">⟳ LearnLoop</div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Start learning today — it's free.</p>

      <div id="alertBox" class="alert alert-error"></div>

      <!-- Registration Form — sends POST /api/auth/register -->
      <div id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input class="form-input" type="text" id="name" placeholder="Alice Sharma" />
          </div>
          <div class="form-group">
            <label class="form-label" for="role">I am a</label>
            <select class="form-select" id="role">
              <option value="student">Student</option>
              <option value="instructor">Instructor</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="Minimum 6 characters" />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-input" type="password" id="confirmPassword" placeholder="Repeat your password" />
        </div>

        <button class="btn-primary btn-full" id="submitBtn" onclick="handleRegister()">
          Create Account
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAuth();
      // Redirect if already logged in
      if (getToken()) window.location.href = "dashboard.html";
    });

    async function handleRegister() {
      clearFieldErrors();
      hideAlert("alertBox");

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const role = document.getElementById("role").value;

      // Client-side validation (mirrors backend rules)
      let hasError = false;

      if (name.length < 2) {
        setFieldError(document.getElementById("name"), "Name must be at least 2 characters");
        hasError = true;
      }

      const emailRegex = /^\w+([.-]?\w+)*@\w+([.-]?\w+)*(\.\w{2,3})+$/;
      if (!emailRegex.test(email)) {
        setFieldError(document.getElementById("email"), "Please enter a valid email address");
        hasError = true;
      }

      if (password.length < 6) {
        setFieldError(document.getElementById("password"), "Password must be at least 6 characters");
        hasError = true;
      }

      if (password !== confirmPassword) {
        setFieldError(document.getElementById("confirmPassword"), "Passwords do not match");
        hasError = true;
      }

      if (hasError) return;

      const btn = document.getElementById("submitBtn");
      btn.textContent = "Creating account...";
      btn.disabled = true;

      try {
        const data = await apiCall("/auth/register", "POST", { name, email, password, role });
        saveAuth(data.token, data.user);
        showAlert("alertBox", "Account created! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (err) {
        showAlert("alertBox", err.message, "error");
        btn.textContent = "Create Account";
        btn.disabled = false;
      }
    }

    // Allow Enter key to submit
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleRegister();
    });
  </script>
</body>
</html>
