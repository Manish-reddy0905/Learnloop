<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — LearnLoop</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><span class="logo-icon">⟳</span>LearnLoop</a>
      <div class="nav-links" id="navLinks">
        <a href="courses.html" class="nav-link">Courses</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <div id="authButtons">
          <a href="login.html" class="btn-ghost">Login</a>
          <a href="register.html" class="btn-primary">Get Started</a>
        </div>
        <div id="userMenu" style="display:none">
          <span id="userGreeting" class="nav-link"></span>
          <button onclick="logout()" class="btn-ghost">Logout</button>
        </div>
      </div>
      <button class="nav-toggle" onclick="toggleNav()">☰</button>
    </div>
  </nav>

  <main>
    <div class="container dashboard">
      <div id="dashboardContent"><p class="loading">Loading dashboard...</p></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAuth();
      if (!requireAuth()) return;
      loadDashboard();
    });

    async function loadDashboard() {
      const user = getUser();

      try {
        // GET /api/courses/my/enrolled — findMany of enrollments
        const data = await apiCall("/courses/my/enrolled", "GET", null, true);
        const enrollments = data.enrollments || [];

        const completed = enrollments.filter((e) => e.isCompleted).length;
        const inProgress = enrollments.filter((e) => !e.isCompleted && e.progress > 0).length;
        const avgProgress = enrollments.length
          ? Math.round(enrollments.reduce((s, e) => s + e.progress, 0) / enrollments.length)
          : 0;

        const isInstructor = user.role === "instructor" || user.role === "admin";

        document.getElementById("dashboardContent").innerHTML = `
          <div class="dashboard-header">
            <h1 class="dashboard-title">Welcome back, ${user.name.split(" ")[0]} 👋</h1>
            <p class="dashboard-subtitle">${user.email} · <span style="text-transform:capitalize;">${user.role}</span></p>
          </div>

          <!-- Stats Row -->
          <div class="stats-row">
            <div class="stat-card">
              <div class="stat-card-num">${enrollments.length}</div>
              <div class="stat-card-label">Enrolled Courses</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-num">${inProgress}</div>
              <div class="stat-card-label">In Progress</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-num">${completed}</div>
              <div class="stat-card-label">Completed</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-num">${avgProgress}%</div>
              <div class="stat-card-label">Avg Progress</div>
            </div>
          </div>

          <!-- Instructor CTA -->
          ${isInstructor ? `
            <div style="background:var(--accent-glow);border:1px solid var(--accent);border-radius:var(--radius);padding:20px 24px;margin-bottom:40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
              <div>
                <div style="font-weight:700;margin-bottom:4px;">You're an Instructor</div>
                <div style="font-size:0.85rem;color:var(--text-muted);">Create and publish your own courses.</div>
              </div>
              <a href="create-course.html" class="btn-primary">+ Create Course</a>
            </div>
          ` : ""}

          <!-- Enrolled Courses -->
          <h2 style="font-size:1.3rem;margin-bottom:20px;">My Courses</h2>

          ${enrollments.length === 0 ? `
            <div class="empty-state">
              <h3>No courses yet</h3>
              <p>Browse our catalog and enroll in a course to get started.</p>
              <a href="courses.html" class="btn-primary" style="margin-top:16px;">Browse Courses</a>
            </div>
          ` : `
            <div class="enrolled-grid">
              ${enrollments.map(enrollment => {
                const course = enrollment.course;
                if (!course) return "";
                const icon = categoryIcons[course.category] || "📚";
                return `
                  <div class="enrolled-card">
                    <div style="font-size:2rem;margin-bottom:12px;">${icon}</div>
                    <div class="enrolled-course-title">${course.title}</div>
                    <div class="enrolled-meta">${course.category} · by ${course.instructor?.name || "Instructor"}</div>
                    <div class="enrolled-progress">
                      <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px;">Progress</div>
                      <div class="progress-bar"><div class="progress-fill" style="width:${enrollment.progress}%"></div></div>
                      <div style="display:flex;justify-content:space-between;margin-top:4px;">
                        <span style="font-size:0.75rem;color:${enrollment.isCompleted ? 'var(--green)' : 'var(--text-muted)'}">
                          ${enrollment.isCompleted ? "✓ Completed" : "In Progress"}
                        </span>
                        <span style="font-size:0.75rem;color:var(--accent);font-weight:600;">${enrollment.progress}%</span>
                      </div>
                    </div>
                    <a href="course.html?id=${course._id}" class="btn-outline btn-full" style="margin-top:16px;font-size:0.85rem;">
                      ${enrollment.isCompleted ? "Review Course" : "Continue Learning"}
                    </a>
                  </div>
                `;
              }).join("")}
            </div>
          `}
        `;
      } catch (err) {
        document.getElementById("dashboardContent").innerHTML =
          `<p class="error-text">Error loading dashboard: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
